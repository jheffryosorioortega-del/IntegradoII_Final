# Monitoreo local de pruebas de carga: k6 -> Prometheus -> Grafana (todo en Docker, sin cuentas).
# Levantar monitoreo:   docker compose up -d
# Lanzar la prueba:     docker compose run --rm k6            (perfil por defecto: carga = 100 usuarios)
# Ver resultados:       http://localhost:3000  (Grafana)
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver      # permite que k6 le envie las metricas
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.3.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"         # solo uso local: entra sin usuario
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-datos:/var/lib/grafana
    depends_on: [prometheus]

  k6:
    image: grafana/k6:latest
    profiles: ["k6"]                            # solo corre cuando lo pides con "run"
    command: run -o experimental-prometheus-rw /scripts/solicitudes.js
    environment:
      BASE_URL: ${BASE_URL:-http://host.docker.internal:8090}   # el frontend corre en tu PC
      PERFIL: ${PERFIL:-carga}
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(95),p(99),min,max,avg
    volumes:
      - ./k6:/scripts:ro
    depends_on: [prometheus]

volumes:
  grafana-datos:
